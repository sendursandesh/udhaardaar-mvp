plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.arthsaathi.master'
    compileSdk 35

    defaultConfig {
        applicationId 'com.arthsaathi.master'
        minSdk 23
        targetSdk 35
        versionCode 800
        versionName '8.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    sourceSets {
        main.java.srcDirs = ['src/main/java']
        main.java.exclude '**/V*.kt'
        main.java.exclude '**/MainActivity.kt'
        main.java.exclude '**/LoginActivity.kt'
        main.java.exclude '**/DashboardV3Activity.kt'
        main.java.exclude '**/AddUdhaarActivity.kt'
        main.java.exclude '**/RecordsActivity.kt'
        main.java.exclude '**/RegisterCreditV3Activity.kt'
        main.java.exclude '**/UdhaarDatabaseHelper.kt'
        main.java.exclude '**/V323Activity.kt'
        main.java.exclude '**/V32Activity.kt'
        main.java.exclude '**/V32DatabaseHelper.kt'
        main.java.exclude '**/V32SafeLauncherActivity.kt'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    testImplementation 'junit:junit:4.13.2'
}
