name: Final V5 APK Assembly
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: tools platform-tools}
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -O /tmp/g.zip
          sudo unzip -q /tmp/g.zip -d /opt
          echo /opt/gradle-8.10.2/bin >> "$GITHUB_PATH"
      - name: Repair QR scanner
        run: |
          cat > app/src/main/java/com/udhaardaar/mvp/QrCreditScannerActivity.kt <<'EOF'
          package com.udhaardaar.mvp
          import android.content.Intent
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import com.google.zxing.integration.android.IntentIntegrator
          import com.google.zxing.integration.android.IntentResult
          import org.json.JSONObject
          class QrCreditScannerActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) { super.onCreate(savedInstanceState); IntentIntegrator(this).apply { setDesiredBarcodeFormats(IntentIntegrator.QR_CODE); setPrompt("Scan credit / invoice QR code"); setBeepEnabled(true); setOrientationLocked(false) }.initiateScan() }
              override fun onActivityResult(requestCode:Int,resultCode:Int,data:Intent?) { val r=IntentIntegrator.parseActivityResult(requestCode,resultCode,data); if(r!=null){val raw=r.contents;if(raw.isNullOrBlank()){setResult(RESULT_CANCELED);finish();return};val f=parse(raw);setResult(RESULT_OK,Intent().apply{putExtra("vendor",f.a);putExtra("invoice",f.b);putExtra("date",f.c);putExtra("amount",f.d);putExtra("raw",raw)});finish();return};super.onActivityResult(requestCode,resultCode,data) }
              private data class F(val a:String="",val b:String="",val c:String="",val d:String="")
              private fun parse(raw:String):F { try{val j=JSONObject(raw);return F(g(j,"vendor","vendor_name","seller","supplier","merchant","party"),g(j,"invoice","invoice_no","invoice_number","bill_no","bill_number"),g(j,"date","invoice_date","transaction_date"),g(j,"amount","total","total_amount","invoice_amount","grand_total"))}catch(_:Exception){};val m=raw.split('&','\n',';').mapNotNull{p->val x=p.split('=',':',limit=2);if(x.size==2)x[0].trim().lowercase() to x[1].trim()else null}.toMap();return F(m["vendor"]?:m["vendor_name"]?:m["seller"]?:m["supplier"]?:"",m["invoice"]?:m["invoice_no"]?:m["invoice_number"]?:"",m["date"]?:m["invoice_date"]?:m["transaction_date"]?:"",m["amount"]?:m["total"]?:m["total_amount"]?:m["invoice_amount"]?:m["grand_total"]?:"")}
              private fun g(j:JSONObject,vararg k:String)=k.firstNotNullOfOrNull{if(j.has(it)&&!j.isNull(it))j.optString(it).takeIf{v->v.isNotBlank()}else null}?:""
          }
          EOF
          sed -i 's/return@button/return@setOnClickListener/g' app/src/main/java/com/udhaardaar/mvp/LoginActivity.kt || true
      - name: Assemble APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Integrity and feature gates
        run: |
          set -e
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          test "$(stat -c%s "$apk")" -gt 10000000
          unzip -t "$apk" >/dev/null
          grep -q 'SCAN QR' app/src/main/java/com/udhaardaar/mvp/V5InformalCreditActivity.kt
          grep -q 'sourceQr' app/src/main/java/com/udhaardaar/mvp/V5WorkflowRepository.kt
          grep -q 'markBorrowerConsent' app/src/main/java/com/udhaardaar/mvp/V5WorkflowRepository.kt
          grep -q 'Rental' app/src/main/java/com/udhaardaar/mvp/V5HomeActivity.kt
          grep -q 'Asset Vault' app/src/main/java/com/udhaardaar/mvp/V5HomeActivity.kt
          grep -q 'Inheritance' app/src/main/java/com/udhaardaar/mvp/V5HomeActivity.kt
          grep -q 'Legal Assistance' app/src/main/java/com/udhaardaar/mvp/V5HomeActivity.kt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Udhaardaar-V5-Final-QA-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
