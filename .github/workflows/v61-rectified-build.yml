name: ArthSaathi V6.1.1 Rectified APK

on:
  push:
    branches: [v6.1-rectified]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V6.1 rectified source
        uses: actions/checkout@v4
        with:
          ref: v6.1-rectified
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Gradle 8.10.2
        shell: bash
        run: |
          set -e
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.10.2/bin" >> "$GITHUB_PATH"
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Compile V6.1.1 APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: V6.1 rectification gates
        shell: bash
        run: |
          set -e
          test -f app/src/main/java/com/udhaardaar/mvp/V61RectifiedActivity.kt
          grep -q 'No such user found' app/src/main/java/com/udhaardaar/mvp/V61RectifiedActivity.kt
          grep -q 'CREDIT_CONSENT' app/src/main/java/com/udhaardaar/mvp/V61RectifiedActivity.kt
          grep -q 'REPAYMENT_CONSENT' app/src/main/java/com/udhaardaar/mvp/V61RectifiedActivity.kt
          grep -q 'merchantId' app/src/main/java/com/udhaardaar/mvp/V61RectifiedActivity.kt
          grep -q 'policyNumber' app/src/main/java/com/udhaardaar/mvp/V61RectifiedActivity.kt
          grep -q 'sumInsured' app/src/main/java/com/udhaardaar/mvp/V61RectifiedActivity.kt
          grep -q 'TTMM_MEMBER_CONSENT' app/src/main/java/com/udhaardaar/mvp/V61RectifiedActivity.kt
          grep -q 'PENDING_VERIFICATION' app/src/main/java/com/udhaardaar/mvp/V61RectifiedActivity.kt
          grep -q 'LOG OUT' app/src/main/java/com/udhaardaar/mvp/V61RectifiedActivity.kt
          grep -q 'V61RectifiedActivity' app/src/main/AndroidManifest.xml
          test "$(grep -o "versionName '[^']*'" app/build.gradle | head -1)" = "versionName '6.1.1'"
      - name: APK integrity
        shell: bash
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          test "$(stat -c%s "$APK")" -gt 10000
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.udhaardaar.mvp'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "versionName='6.1.1'"
      - name: Upload V6.1.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: ArthSaathi-V6.1.1-Rectified-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
