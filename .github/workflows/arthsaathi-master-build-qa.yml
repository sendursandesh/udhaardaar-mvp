name: ArthSaathi Master Build QA

on:
  push:
    branches:
      - arthsaathi-master-consolidated-2026-10-05
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo /opt/gradle-8.10.2/bin >> "$GITHUB_PATH"
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK exists
        run: test -f app/build/outputs/apk/debug/app-debug.apk
