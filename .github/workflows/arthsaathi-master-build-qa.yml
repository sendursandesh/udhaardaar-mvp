name: ArthSaathi Master Build QA

on:
  push:
    branches:
      - arthsaathi-master-consolidated-2026-10-05
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unit tests
        run: bash gradlew :app:testDebugUnitTest --stacktrace
      - name: Debug APK
        run: bash gradlew :app:assembleDebug --stacktrace
      - name: Verify APK exists
        run: test -f app/build/outputs/apk/debug/app-debug.apk
