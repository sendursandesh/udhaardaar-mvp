name: Build Udhaardaar V3 Corrections

on:
  push:
    branches:
      - v3-complete-correction-pass-2026-08-27
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools emulator
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Run 15-record integration and activity smoke QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --stacktrace
      - name: Verify APK 10 times
        run: |
          for i in $(seq 1 10); do
            echo "Verification $i/10"
            test -s app/build/outputs/apk/debug/app-debug.apk
            sha256sum app/build/outputs/apk/debug/app-debug.apk
          done
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: udhaardaar-v3-corrections-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
