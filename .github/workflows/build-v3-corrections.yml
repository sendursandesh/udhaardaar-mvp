name: Build Udhaardaar V3 Corrections

on:
  push:
    branches:
      - v3-complete-correction-pass-2026-08-27
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact V3 complete-correction branch
        uses: actions/checkout@v5
        with:
          ref: v3-complete-correction-pass-2026-08-27
          fetch-depth: 1

      - name: Verify exact V3 source
        run: |
          EXPECTED_BRANCH="v3-complete-correction-pass-2026-08-27"
          ACTUAL_REF="${GITHUB_REF_NAME}"
          test "$ACTUAL_REF" = "$EXPECTED_BRANCH"
          echo "SOURCE_BRANCH=$ACTUAL_REF"
          echo "SOURCE_SHA=$(git rev-parse HEAD)"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools emulator

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Run Android integration and activity smoke QA
        id: integration_qa
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-load -no-snapshot-save -camera-back none -camera-front none
          disable-animations: true
          emulator-boot-timeout: 600
          cores: 2
          ram-size: 2048M
          script: |
            adb wait-for-device
            adb shell getprop ro.build.version.sdk
            adb shell getprop sys.boot_completed
            timeout 1200s gradle :app:connectedDebugAndroidTest --stacktrace --no-daemon

      - name: Upload Android QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: udhaardaar-v3-android-qa-report
          path: |
            app/build/outputs/androidTest-results/**
            app/build/outputs/connected_android_test_additional_output/**
            app/build/outputs/logs/**
          if-no-files-found: warn

      - name: Verify APK 10 times
        run: |
          for i in $(seq 1 10); do
            echo "Verification $i/10"
            test -s app/build/outputs/apk/debug/app-debug.apk
            sha256sum app/build/outputs/apk/debug/app-debug.apk
          done

      - name: Upload final V3 corrections APK
        uses: actions/upload-artifact@v4
        with:
          name: udhaardaar-v3-complete-correction-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
