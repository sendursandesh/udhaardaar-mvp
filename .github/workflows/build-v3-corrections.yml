name: Build Udhaardaar V3 Corrections

on:
  push:
    branches:
      - v3-complete-correction-pass-2026-08-27
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact V3 complete-correction branch
        uses: actions/checkout@v5
        with:
          ref: v3-complete-correction-pass-2026-08-27
          fetch-depth: 1
      - name: Verify exact V3 source branch
        run: |
          test "$(git branch --show-current)" = "v3-complete-correction-pass-2026-08-27"
          echo "SOURCE_BRANCH=$(git branch --show-current)"
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools emulator
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Run 15-record integration and activity smoke QA
        id: integration_qa
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -memory 2048
          disable-animations: true
          disable-linux-hw-accel: true
          emulator-boot-timeout: 600
          script: |
            timeout 600s gradle :app:connectedDebugAndroidTest --stacktrace --no-daemon
      - name: Upload Android QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: udhaardaar-v3-android-qa-report
          path: |
            app/build/outputs/androidTest-results/**
            app/build/outputs/connected_android_test_additional_output/**
            app/build/outputs/logs/**
          if-no-files-found: warn
      - name: Fail if Android QA failed
        if: steps.integration_qa.outcome != 'success'
        run: |
          echo "Android integration/activity QA failed. Test reports were uploaded for diagnosis."
          exit 1
      - name: Verify APK 10 times
        run: |
          for i in $(seq 1 10); do
            echo "Verification $i/10"
            test -s app/build/outputs/apk/debug/app-debug.apk
            sha256sum app/build/outputs/apk/debug/app-debug.apk
          done
      - name: Upload final V3 corrections APK
        uses: actions/upload-artifact@v4
        with:
          name: udhaardaar-v3-complete-correction-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
