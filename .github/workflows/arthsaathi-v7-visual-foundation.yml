name: ArthSaathi V7 Step 6 Native Master Vision

on:
  workflow_dispatch:
  pull_request:
    branches: [arthsaathi-v7-master-build-2026-09-23]
  push:
    branches: [arthsaathi-v7-visual-foundation-2026-09-22, arthsaathi-v7-master-build-2026-09-23, arthsaathi-v7-step1-5-rectification-2026-09-24, arthsaathi-v7-step6-native-master-vision-2026-09-24, arthsaathi-v7-master-integration-qa-2026-09-25, arthsaathi-v7-final-emulator-qa-2026-09-26, arthsaathi-v7-final-acceptance-2026-09-28]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -e
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo /opt/gradle-8.10.2/bin >> "$GITHUB_PATH"

      - name: Compile V7 APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: V7 branding and architecture gate
        run: |
          set -e
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          test "$(stat -c%s "$apk")" -gt 10000000
          unzip -t "$apk" >/dev/null
          grep -q "versionCode 70" app/build.gradle
          grep -q "versionName '7.0'" app/build.gradle
          grep -q "V7HomeActivity" app/src/main/AndroidManifest.xml
          grep -q "V7ModuleActivity" app/src/main/AndroidManifest.xml
          test -s app/src/main/java/com/udhaardaar/mvp/V7LocalStore.kt
          test -s app/src/main/java/com/udhaardaar/mvp/V7MasterVisionRegistry.kt
          test -s app/src/main/java/com/udhaardaar/mvp/V7NativeModuleActivity.kt
          test -s app/src/main/java/com/udhaardaar/mvp/V7LegacyProjectionSync.kt
          grep -q "enum class Ownership" app/src/main/java/com/udhaardaar/mvp/V7MasterVisionRegistry.kt
          grep -q "V7NativeModuleActivity" app/src/main/AndroidManifest.xml
          ! grep -q "V7LegacyAdapter" app/src/main/java/com/udhaardaar/mvp/V7NativeModuleActivity.kt
          grep -q "V7Records.person" app/src/main/java/com/udhaardaar/mvp/V7NativeModuleActivity.kt
          grep -q "V7Records.relationship" app/src/main/java/com/udhaardaar/mvp/V7NativeModuleActivity.kt
          grep -q "V7Records.repayment" app/src/main/java/com/udhaardaar/mvp/V7NativeModuleActivity.kt
          grep -q "V7Records.asset" app/src/main/java/com/udhaardaar/mvp/V7NativeModuleActivity.kt
          grep -q "V7Records.liability" app/src/main/java/com/udhaardaar/mvp/V7NativeModuleActivity.kt
          grep -q "V7LegacyProjectionSync.sync" app/src/main/java/com/udhaardaar/mvp/UdhaardaarApp.kt
          grep -q "V7LegacyProjectionSync" app/src/main/java/com/udhaardaar/mvp/V7LegacyProjectionSync.kt
          grep -q "native()" app/src/main/java/com/udhaardaar/mvp/V7MasterVisionRegistry.kt
          ! grep -q "V5LocalStore" app/src/main/java/com/udhaardaar/mvp/V7CoreArchitecture.kt
          ! grep -q "V62[A-Za-z].*Activity" app/src/main/java/com/udhaardaar/mvp/V7ModuleActivity.kt
          grep -q "V7LegacyAdapter" app/src/main/java/com/udhaardaar/mvp/V7ModuleActivity.kt
          grep -q "Navigate Your Financial Journey" app/src/main/java/com/udhaardaar/mvp/ArthSaathiV7Design.kt
          grep -q "Your Asset. Your Record. Your Right." app/src/main/java/com/udhaardaar/mvp/ArthSaathiV7Design.kt
          grep -q "Plan • Protect • Grow • Nominate" app/src/main/java/com/udhaardaar/mvp/ArthSaathiV7Design.kt
          grep -q "validMethod" app/src/main/java/com/udhaardaar/mvp/V7CoreArchitecture.kt
          test -s app/src/main/res/drawable/arthsaathi_logo.xml
          echo "V7 visual foundation gates passed"

      - name: Unit tests
        timeout-minutes: 8
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Security and privacy gate
        run: |
          set -e
          manifest=app/src/main/AndroidManifest.xml
          app=app/src/main/java/com/udhaardaar/mvp/UdhaardaarApp.kt
          store=app/src/main/java/com/udhaardaar/mvp/V7LocalStore.kt
          account=app/src/main/java/com/udhaardaar/mvp/V7AccountStore.kt
          reminder=app/src/main/java/com/udhaardaar/mvp/ReminderReceiver.kt
          grep -q 'android:allowBackup="false"' "$manifest"
          grep -q 'android:fullBackupContent="false"' "$manifest"
          grep -q 'android:usesCleartextTraffic="false"' "$manifest"
          grep -q 'FLAG_SECURE' "$app"
          grep -q 'AndroidKeyStore' "$store"
          grep -q 'AES/GCM/NoPadding' "$store"
          grep -q 'V7LocalStore' "$account"
          ! grep -R 'getSharedPreferences("udhaardaar_accounts"' -n app/src/main/java
          ! grep -R 'getSharedPreferences("v5_' -n app/src/main/java
          ! grep -R 'getSharedPreferences("v62_' -n app/src/main/java
          grep -q 'VISIBILITY_PRIVATE' "$reminder"
          ! grep -R 'Log\.d\|Log\.i\|Log\.v\|Log\.w\|Log\.e' -n app/src/main/java
          echo "V7 security/privacy static gate passed"

      - name: Enable KVM for Android emulator
        run: |
          set -euxo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          ls -l /dev/kvm

      - name: Android emulator smoke tests
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 120
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disk-size: 8000M
          heap-size: 1024M
          emulator-boot-timeout: 1200
          emulator-build: 15004761
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save -camera-back none
          pre-emulator-launch-script: adb kill-server || true; adb start-server
          disable-animations: true
          script: |
            mkdir -p build/v7-emulator-diagnostics
            adb start-server
            adb wait-for-device
            adb devices -l | tee build/v7-emulator-diagnostics/adb-devices.txt
            adb shell getprop sys.boot_completed > build/v7-emulator-diagnostics/boot-completed.txt
            adb shell getprop > build/v7-emulator-diagnostics/getprop.txt
            adb shell pm path android > build/v7-emulator-diagnostics/pm-path.txt
            adb shell dumpsys package com.udhaardaar.mvp > build/v7-emulator-diagnostics/package.txt
            set +e
            gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace > build/v7-emulator-diagnostics/instrumentation.log 2>&1
            rc=$?
            if [ "$rc" -ne 0 ] && grep -qiE "device offline|device .*offline|more than one device" build/v7-emulator-diagnostics/instrumentation.log; then adb reconnect offline >/dev/null 2>&1 || true; sleep 3; gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace > build/v7-emulator-diagnostics/instrumentation-retry.log 2>&1; rc=$?; fi
            if [ "$rc" -ne 0 ]; then cat build/v7-emulator-diagnostics/instrumentation.log; exit "$rc"; fi
            echo "V7 emulator instrumentation PASS"

      - name: Capture emulator diagnostics
        if: always()
        timeout-minutes: 3
        run: |
          set +e
          mkdir -p build/v7-emulator-diagnostics
          timeout 10s adb devices -l > build/v7-emulator-diagnostics/adb-devices-final.txt 2>&1 || true
          timeout 10s adb shell getprop > build/v7-emulator-diagnostics/getprop-final.txt 2>&1 || true
          timeout 10s adb shell dumpsys activity activities > build/v7-emulator-diagnostics/activity.txt 2>&1 || true
          timeout 10s adb shell dumpsys meminfo > build/v7-emulator-diagnostics/meminfo.txt 2>&1 || true
          timeout 15s adb logcat -d -v threadtime > build/v7-emulator-diagnostics/logcat.txt 2>&1 || true
          timeout 10s adb shell screencap -p /sdcard/v7-final.png >/dev/null 2>&1 || true
          timeout 10s adb pull /sdcard/v7-final.png build/v7-emulator-diagnostics/v7-final.png >/dev/null 2>&1 || true
          find app/build/outputs -type f -maxdepth 8 -print > build/v7-emulator-diagnostics/build-outputs.txt 2>&1
          timeout 15s adb pull /sdcard/arthsaathi_v7 build/v7-emulator-diagnostics/arthsaathi_v7 >/dev/null 2>&1 || true
          find app/build/test-results app/build/reports -type f -maxdepth 10 -print > build/v7-emulator-diagnostics/test-reports.txt 2>&1
          true

      - name: Upload V7 emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArthSaathi-V7-emulator-diagnostics
          path: build/v7-emulator-diagnostics
          if-no-files-found: warn
          retention-days: 30

      - name: Upload V7 APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArthSaathi-V7-Visual-Foundation-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
