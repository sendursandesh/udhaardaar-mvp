name: ArthSaathi V7 Final Emulator Regression

on:
  workflow_dispatch:
  push:
    branches: [arthsaathi-v7-emulator-regression-isolated-2026-09-26]
  pull_request:
    branches: [arthsaathi-v7-master-build-2026-09-23]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "platforms;android-34" "build-tools;35.0.0"
      - name: Install Gradle
        run: |
          set -euo pipefail
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo /opt/gradle-8.10.2/bin >> "$GITHUB_PATH"
      - name: Compile V7 APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: V7 architecture branding and version gate
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          grep -q "versionCode 70" app/build.gradle
          grep -q "versionName '7.0'" app/build.gradle
          grep -q "V7HomeActivity" app/src/main/AndroidManifest.xml
          grep -q "V7NativeModuleActivity" app/src/main/AndroidManifest.xml
          test -s app/src/main/java/com/udhaardaar/mvp/V7LocalStore.kt
          test -s app/src/main/java/com/udhaardaar/mvp/V7MasterVisionRegistry.kt
          test -s app/src/main/java/com/udhaardaar/mvp/V7LegacyProjectionSync.kt
          test -s app/src/main/res/drawable/arthsaathi_logo.xml
          grep -q "Navigate Your Financial Journey" app/src/main/java/com/udhaardaar/mvp/ArthSaathiV7Design.kt
          grep -q "Your Asset. Your Record. Your Right." app/src/main/java/com/udhaardaar/mvp/ArthSaathiV7Design.kt
          echo "V7 architecture/branding/version gate passed"
      - name: Unit tests
        timeout-minutes: 8
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Security and privacy static gate
        run: |
          set -euo pipefail
          manifest=app/src/main/AndroidManifest.xml
          app=app/src/main/java/com/udhaardaar/mvp/UdhaardaarApp.kt
          store=app/src/main/java/com/udhaardaar/mvp/V7LocalStore.kt
          account=app/src/main/java/com/udhaardaar/mvp/V7AccountStore.kt
          reminder=app/src/main/java/com/udhaardaar/mvp/ReminderReceiver.kt
          grep -q 'android:allowBackup="false"' "$manifest"
          grep -q 'android:fullBackupContent="false"' "$manifest"
          grep -q 'android:usesCleartextTraffic="false"' "$manifest"
          grep -q 'FLAG_SECURE' "$app"
          grep -q 'AndroidKeyStore' "$store"
          grep -q 'AES/GCM/NoPadding' "$store"
          grep -q 'V7LocalStore' "$account"
          ! grep -R 'getSharedPreferences("udhaardaar_accounts"' -n app/src/main/java
          ! grep -R 'getSharedPreferences("v5_' -n app/src/main/java
          ! grep -R 'getSharedPreferences("v62_' -n app/src/main/java
          grep -q 'VISIBILITY_PRIVATE' "$reminder"
          ! grep -R 'Log\.d\|Log\.i\|Log\.v\|Log\.w\|Log\.e' -n app/src/main/java
          echo "V7 security/privacy static gate passed"
      - name: Android emulator regression
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data
          disable-animations: true
          shell: bash
          script: |
            set -euo pipefail
            adb start-server
            adb wait-for-device
            for i in $(seq 1 45); do
              if adb shell pm path android >/dev/null 2>&1; then break; fi
              sleep 2
            done
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            adb shell pm path android
            run_test() {
              name="$1"
              class="$2"
              echo "===== V7 REGRESSION: $name ====="
              timeout 6m gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace -Pandroid.testInstrumentationRunnerArguments.class="$class"
              echo "===== PASS: $name ====="
            }
            run_test "legacy/V6.2 lifecycle smoke" "com.udhaardaar.mvp.ArthSaathiV62SmokeTest"
            run_test "V7 broad functional/UI regression" "com.udhaardaar.mvp.V7BroadFunctionalUiRegressionInstrumentedTest"
            run_test "V7 master integration matrix" "com.udhaardaar.mvp.V7MasterIntegrationScenarioInstrumentedTest"
            run_test "V7 persistence boundary" "com.udhaardaar.mvp.V7PersistenceBoundaryInstrumentedTest"
            run_test "V7 secure account/session" "com.udhaardaar.mvp.V7SecureAccountInstrumentedTest"
            run_test "V7 Step 1-5 integration" "com.udhaardaar.mvp.V7Step1To5IntegrationInstrumentedTest"
            run_test "V7 Step 6 native migration" "com.udhaardaar.mvp.V7Step6NativeMigrationInstrumentedTest"
      - name: Upload V7 APK
        uses: actions/upload-artifact@v4
        with:
          name: ArthSaathi-V7-Final-Regression-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
