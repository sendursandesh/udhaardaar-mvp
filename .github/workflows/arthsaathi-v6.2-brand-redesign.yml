name: ArthSaathi V6.2 Brand Redesign Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [arthsaathi-v6.2-brand-redesign]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Gradle 8.10.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo /opt/gradle-8.10.2/bin >> "$GITHUB_PATH"
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Assemble V6.2 APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify V6.2 APK and flows
        run: |
          set -e
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          test "$(stat -c%s "$apk")" -gt 10000000
          unzip -t "$apk" >/dev/null
          grep -q "versionCode 64" app/build.gradle
          grep -q "versionName '6.2'" app/build.gradle
          grep -q 'Navigate Your Financial Journey' app/src/main/java/com/udhaardaar/mvp/LoginActivity.kt
          grep -q 'Plan • Protect • Grow • Nominate' app/src/main/java/com/udhaardaar/mvp/LanguageManager.kt
          grep -q 'R.drawable.udhaardaar_logo' app/src/main/java/com/udhaardaar/mvp/V62HomeActivity.kt
          grep -q 'Quick access' app/src/main/java/com/udhaardaar/mvp/V62HomeActivity.kt
          ! grep -q 'SMART ACTIONS' app/src/main/java/com/udhaardaar/mvp/V62HomeActivity.kt
          ! grep -q 'ScrollView' app/src/main/java/com/udhaardaar/mvp/V62HomeActivity.kt
          grep -q 'sans-serif' app/src/main/java/com/udhaardaar/mvp/UdhaardaarApp.kt
          grep -q 'V62CreditRegistrationActivity' app/src/main/AndroidManifest.xml
          grep -q 'CREATE NEW PROFILE' app/src/main/java/com/udhaardaar/mvp/V62CreditRegistrationActivity.kt
          grep -q 'REQUEST CONSENT OTP' app/src/main/java/com/udhaardaar/mvp/V62CreditRegistrationActivity.kt
      - name: Upload V6.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: ArthSaathi-V6.2-Brand-Redesign-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
