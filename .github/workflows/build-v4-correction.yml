name: Build Udhaardaar V4 Complete Correction
on:
  push:
    branches:
      - v4-complete-correction-2026-08-30
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4-complete-correction-2026-08-30
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo /opt/gradle-8.10.2/bin >> $GITHUB_PATH
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk | grep -q "package: name='com.udhaardaar.mvp'"
      - uses: actions/upload-artifact@v4
        with:
          name: Udhaardaar-v4-complete-correction-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
