name: ArthSaathi Consolidated Architecture Verification

on:
  workflow_dispatch:
  push:
    branches:
      - arthsaathi-consolidated-architecture-verification-2026-10-05

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo /opt/gradle-8.10.2/bin >> "$GITHUB_PATH"

      - name: Unit architecture verification
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble V6.2 APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Consolidated architecture gates
        run: |
          set -e
          test -f app/build/outputs/apk/debug/app-debug.apk
          test "$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)" -gt 1000000
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          grep -q "versionName '6.2'" app/build.gradle
          grep -q 'V62HomeActivity' app/src/main/AndroidManifest.xml
          grep -q 'V62BureauActivity' app/src/main/AndroidManifest.xml
          grep -q 'V62ChargeCheckActivity' app/src/main/AndroidManifest.xml
          grep -q 'V62ChargesActivity' app/src/main/AndroidManifest.xml
          grep -q 'ArthSaathiConsolidatedArchitecture' app/src/main/java/com/udhaardaar/mvp/V62HomeActivity.kt
          grep -q 'REGISTER_CREDIT_IS_NEW_CREDIT_ONLY' app/src/main/java/com/udhaardaar/mvp/ArthSaathiConsolidatedArchitecture.kt
          for token in 'INFORMAL_CREDIT' 'CREDIT_BUREAU' 'QR_KHATA' 'ASSET_VAULT' 'INSURANCE_PROTECT' 'CHARGECHECK' 'GROUP_KHATA' 'WILL_LEGACY' 'LEGAL_ASSISTANCE' 'AI_ADVISOR' 'MIS' 'RENTAL_LEASE' 'REVENUE'; do
            grep -q "$token" app/src/main/java/com/udhaardaar/mvp/ArthSaathiConsolidatedArchitecture.kt
          done
          echo "CONSOLIDATED ARCHITECTURE VERIFICATION PASSED: $(git rev-parse HEAD)"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: ArthSaathi-V6.2-Consolidated-Verification
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
