name: ArthSaathi V6.2 Architecture Build
on:
  workflow_dispatch:
  push:
    branches: [arthsaathi-v6.2-final-architecture]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo /opt/gradle-8.10.2/bin >> "$GITHUB_PATH"
      - name: Compile V6.2
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Architecture acceptance gates
        run: |
          set -e
          test -s app/build/outputs/apk/debug/app-debug.apk
          test "$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)" -gt 10000000
          grep -q "versionCode 64" app/build.gradle
          grep -q "versionName '6.2'" app/build.gradle
          grep -q 'V62ArchitectureSpec' app/src/main/java/com/udhaardaar/mvp/V62ArchitectureSpec.kt
          grep -q 'V62EventBus' app/src/main/java/com/udhaardaar/mvp/V62ArchitectureEngine.kt
          grep -q 'HISTORY_SHARING' app/src/main/java/com/udhaardaar/mvp/V62ArchitectureSpec.kt
          grep -q 'CREDIT_REGISTRATION' app/src/main/java/com/udhaardaar/mvp/V62ArchitectureSpec.kt
          grep -q 'V62DocumentScanner' app/src/main/java/com/udhaardaar/mvp/V62DocumentScanner.kt
          grep -q 'V62DonutChart' app/src/main/java/com/udhaardaar/mvp/V62Charts.kt
          grep -q 'V62TTMMActivity' app/src/main/AndroidManifest.xml
          grep -q 'V62LegacyLegalAIActivity' app/src/main/AndroidManifest.xml
          grep -q 'LoginActivity' app/src/main/AndroidManifest.xml
          ! grep -q 'windowSplashScreenAnimatedIcon' app/src/main/res/values/styles.xml
      - uses: actions/upload-artifact@v4
        with:
          name: ArthSaathi-V6.2-Architecture-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
