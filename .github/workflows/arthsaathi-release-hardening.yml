name: ArthSaathi Release Hardening

on:
  push:
    branches:
      - arthsaathi-release-hardening-2026-10-10
  pull_request:
    branches:
      - arthsaathi-release-hardening-2026-10-10
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arthsaathi-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.10.2
        run: |
          set -euo pipefail
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo /opt/gradle-8.10.2/bin >> "$GITHUB_PATH"

      - name: Clean, unit test and assemble debug APK
        run: gradle clean :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK archive and record checksum
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          sha256sum "$apk" | tee app/build/outputs/apk/debug/SHA256SUMS.txt
          echo "APK bytes: $(stat -c%s "$apk")"
          echo "APK SHA-256 recorded above."

      - name: Upload debug APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: arthsaathi-release-hardening-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 30

  emulator-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.10.2
        run: |
          set -euo pipefail
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo /opt/gradle-8.10.2/bin >> "$GITHUB_PATH"

      - name: Run Android instrumentation suite on API 34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 20
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p app/build/qa-diagnostics
            adb devices -l
            adb shell getprop sys.boot_completed
            timeout 25m gradle :app:connectedDebugAndroidTest --no-daemon --no-parallel --max-workers=2 --stacktrace
            mkdir -p app/build/qa-diagnostics
            adb logcat -d -t 6000 > app/build/qa-diagnostics/emulator-logcat.txt 2>&1 || true

      - name: Upload emulator test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arthsaathi-emulator-test-results-${{ github.sha }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/apk/androidTest/
            app/build/qa-diagnostics/
          if-no-files-found: warn
          retention-days: 30
