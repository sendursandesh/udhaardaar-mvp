name: ArthSaathi Release Hardening

on:
  push:
    branches:
      - arthsaathi-release-hardening-2026-10-10
  pull_request:
    branches:
      - arthsaathi-release-hardening-2026-10-10
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arthsaathi-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.10.2
        run: |
          set -euo pipefail
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo /opt/gradle-8.10.2/bin >> "$GITHUB_PATH"

      - name: Clean, unit test and assemble debug APK
        run: gradle clean :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK archive and record checksum
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          sha256sum "$apk" | tee app/build/outputs/apk/debug/SHA256SUMS.txt
          echo "APK bytes: $(stat -c%s "$apk")"
          echo "APK SHA-256 recorded above."

      - name: Upload debug APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: arthsaathi-release-hardening-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 30

  emulator-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.10.2
        run: |
          set -euo pipefail
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo /opt/gradle-8.10.2/bin >> "$GITHUB_PATH"

      - name: Run Android instrumentation suite on API 34 emulator
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;35.0.0" "emulator" "system-images;android-34;google_apis;x86_64"
          echo no | "${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager" create avd --force -n arthsaathi-ci -k "system-images;android-34;google_apis;x86_64" -d "pixel_2"
          emulator -avd arthsaathi-ci -port 5554 -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader -memory 2048 -cores 2 -accel off > /tmp/arthsaathi-emulator.log 2>&1 &
          EMULATOR_PID=$!
          cleanup() {
            adb -s emulator-5554 emu kill >/dev/null 2>&1 || kill "$EMULATOR_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          adb start-server
          echo "Waiting up to 10 minutes for emulator device..."
          timeout 600 adb -s emulator-5554 wait-for-device
          booted=0
          for i in $(seq 1 120); do
            state="$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$state" = "1" ]; then booted=1; break; fi
            sleep 5
          done
          if [ "$booted" -ne 1 ]; then
            echo "Emulator did not finish booting."
            cat /tmp/arthsaathi-emulator.log || true
            adb devices -l || true
            exit 1
          fi
          adb devices -l
          echo "Emulator booted. Running connected Android instrumentation tests."
          timeout 18m gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace || {
            echo "Instrumentation failed; collecting diagnostics."
            adb logcat -d -t 6000 || true
            cat /tmp/arthsaathi-emulator.log || true
            exit 1
          }

      - name: Upload emulator test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arthsaathi-emulator-test-results-${{ github.sha }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/apk/androidTest/
          if-no-files-found: warn
          retention-days: 30
