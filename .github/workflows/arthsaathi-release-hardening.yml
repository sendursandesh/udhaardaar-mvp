name: ArthSaathi Release Hardening

on:
  push:
    branches:
      - arthsaathi-release-hardening-2026-10-10
  pull_request:
    branches:
      - arthsaathi-release-hardening-2026-10-10
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arthsaathi-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.10.2
        run: |
          set -euo pipefail
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo /opt/gradle-8.10.2/bin >> "$GITHUB_PATH"

      - name: Clean, unit test and assemble debug APK
        run: gradle clean :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK archive and record checksum
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          sha256sum "$apk" | tee app/build/outputs/apk/debug/SHA256SUMS.txt
          echo "APK bytes: $(stat -c%s "$apk")"
          echo "APK SHA-256 recorded above."

      - name: Upload debug APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: arthsaathi-release-hardening-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 30

  emulator-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.10.2
        run: |
          set -euo pipefail
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo /opt/gradle-8.10.2/bin >> "$GITHUB_PATH"

      - name: Enable and verify KVM for emulator
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo modprobe kvm || true
            sudo modprobe kvm_intel || sudo modprobe kvm_amd || true
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            # Hosted runners may expose KVM as root:kvm while the runner user
            # is not in the kvm group. Grant this ephemeral CI runner access.
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
            test -r /dev/kvm && test -w /dev/kvm
          else
            echo "No /dev/kvm on this runner; emulator will use software acceleration."
          fi

      - name: Run Android instrumentation suite on API 34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 50
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 1800
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save -camera-back none
          disable-animations: true
          verbose: true
          script: |
            set -eu
            mkdir -p app/build/qa-diagnostics
            trap 'adb logcat -d -t 8000 > app/build/qa-diagnostics/emulator-logcat.txt 2>&1 || true; adb devices -l > app/build/qa-diagnostics/adb-devices.txt 2>&1 || true' EXIT
            adb devices -l
            adb wait-for-device
            attempt=0; while [ "$attempt" -lt 180 ]; do booted="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"; if [ "$booted" = "1" ]; then break; fi; attempt=$((attempt + 1)); sleep 2; done
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            adb shell cmd package list packages >/dev/null
            timeout 18m gradle :app:connectedDebugAndroidTest --no-daemon --no-parallel --max-workers=2 --stacktrace
            python3 - <<'PY'
            import glob
            import sys
            import xml.etree.ElementTree as ET

            reports = glob.glob("app/build/outputs/androidTest-results/**/*.xml", recursive=True)
            reports = [p for p in reports if p.lower().endswith(".xml")]
            if not reports:
                sys.exit("FAIL: no instrumentation XML reports were generated")
            total_tests = total_failures = total_errors = 0
            for path in reports:
                try:
                    root = ET.parse(path).getroot()
                except ET.ParseError:
                    continue
                suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
                for suite in suites:
                    total_tests += int(suite.attrib.get("tests", "0"))
                    total_failures += int(suite.attrib.get("failures", "0"))
                    total_errors += int(suite.attrib.get("errors", "0"))
            print(f"Instrumentation report totals: tests={total_tests}, failures={total_failures}, errors={total_errors}")
            if total_tests < 1:
                sys.exit("FAIL: reports exist but contain no executed tests")
            if total_failures or total_errors:
                sys.exit("FAIL: instrumentation tests reported failures or errors")
            PY

      - name: Upload emulator test reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arthsaathi-emulator-test-results-${{ github.sha }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/apk/androidTest/
            app/build/qa-diagnostics/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 30
