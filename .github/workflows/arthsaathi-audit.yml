name: ArthSaathi Full Audit Gate

on:
  push:
    branches:
      - arthsaathi-step1-5-functional-audit-2026-10-18
  pull_request:
    branches:
      - arthsaathi-step1-5-functional-audit-2026-10-18
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arthsaathi-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-unit-tests:
    name: Build APK and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout audited branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle 8.7 (project has no checked-in wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build and run unit tests
        run: gradle --no-daemon clean testDebugUnitTest assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: arthsaathi-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arthsaathi-unit-test-results-${{ github.sha }}
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  emulator-acceptance:
    name: Emulator instrumentation acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout audited branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle 8.7 (project has no checked-in wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Run instrumented acceptance suite on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          script: gradle --no-daemon connectedDebugAndroidTest
      - name: Upload instrumentation test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arthsaathi-emulator-results-${{ github.sha }}
          path: app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14
