name: ArthSaathi Full Audit Gate

on:
  push:
    branches:
      - arthsaathi-step1-5-functional-audit-2026-10-18
  pull_request:
    branches:
      - arthsaathi-step1-5-functional-audit-2026-10-18
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arthsaathi-audit-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-and-unit-tests:
    name: Build APK and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout audited branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify release branch and app identity
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BRANCH="arthsaathi-step1-5-functional-audit-2026-10-18"
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}" || {
            echo "::error::Refusing release artifact from unexpected branch: ${GITHUB_REF_NAME}"
            exit 1
          }
          GRADLE_FILE="app/build.gradle"
          grep -Fq "applicationId 'com.arthsaathi.master'" "${GRADLE_FILE}"
          grep -Fq "versionCode 801" "${GRADLE_FILE}"
          grep -Fq "versionName '8.0.1'" "${GRADLE_FILE}"
          mkdir -p app/build/release-provenance
          {
            echo "product=ArthSaathi"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "applicationId=com.arthsaathi.master"
            echo "versionCode=801"
            echo "versionName=8.0.1"
            echo "workflowRunId=${GITHUB_RUN_ID}"
            echo "workflowRunAttempt=${GITHUB_RUN_ATTEMPT}"
            echo "builtAtUtc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > app/build/release-provenance/release-provenance.txt
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.7 (project has no checked-in wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build and run unit tests
        run: gradle --no-daemon clean testDebugUnitTest assembleDebug
      - name: Verify APK identity and calculate checksum
        shell: bash
        run: |
          set -euo pipefail
          echo "=== APK files produced by Gradle ==="
          find app/build/outputs/apk -type f -name '*.apk' -print
          APK="$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          AAPT="${ANDROID_HOME}/build-tools/35.0.0/aapt"
          test -x "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -Fq "package: name='com.arthsaathi.master' versionCode='801' versionName='8.0.1'"
          mkdir -p app/build/release-provenance
          cp "$APK" app/build/release-provenance/arthsaathi-debug.apk
          echo "verifiedApkSource=$APK" > app/build/release-provenance/apk-identity.txt
          printf '%s\n' "$BADGING" | grep '^package:' >> app/build/release-provenance/apk-identity.txt
          sha256sum app/build/release-provenance/arthsaathi-debug.apk | tee app/build/release-provenance/apk-sha256.txt
      - name: Upload debug APK and provenance
        uses: actions/upload-artifact@v4
        with:
          name: arthsaathi-debug-${{ github.sha }}
          path: |
            app/build/release-provenance/arthsaathi-debug.apk
            app/build/release-provenance/
          if-no-files-found: error
          retention-days: 14
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arthsaathi-unit-test-results-${{ github.sha }}
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  emulator-acceptance:
    name: Emulator instrumentation acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout audited branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify emulator job branch and app identity
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BRANCH="arthsaathi-step1-5-functional-audit-2026-10-18"
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}" || {
            echo "::error::Refusing emulator validation on unexpected branch: ${GITHUB_REF_NAME}"
            exit 1
          }
          grep -Fq "applicationId 'com.arthsaathi.master'" app/build.gradle
          grep -Fq "versionCode 801" app/build.gradle
          grep -Fq "versionName '8.0.1'" app/build.gradle
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.7 (project has no checked-in wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Enable and verify KVM for emulator
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo modprobe kvm || true
            sudo modprobe kvm_intel || sudo modprobe kvm_amd || true
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
            test -r /dev/kvm && test -w /dev/kvm
          else
            echo "::error::KVM is unavailable on this runner; refusing a slow software-emulated acceptance run."
            exit 1
          fi
      - name: Run instrumented acceptance suite on Android 14 emulator
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save -camera-back none
          disable-animations: true
          script: bash .github/scripts/run-emulator-tests.sh
      - name: Upload instrumentation test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arthsaathi-emulator-results-${{ github.sha }}
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/qa-diagnostics/
          if-no-files-found: warn
          retention-days: 14
