name: ArthSaathi Independent Master 8.0

on:
  push:
    branches:
      - arthsaathi-consolidated-implementation-2026-10-06
  workflow_dispatch:

jobs:
  architecture-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo /opt/gradle-8.10.2/bin >> "$GITHUB_PATH"
      - name: Architecture boundary guard
        run: |
          set -euo pipefail
          files=(
            app/src/main/AndroidManifest.xml
            app/src/main/java/com/udhaardaar/mvp/ArthSaathiApp.kt
            app/src/main/java/com/udhaardaar/mvp/ArthSaathiSession.kt
            app/src/main/java/com/udhaardaar/mvp/ArthSaathiDataStore.kt
            app/src/main/java/com/udhaardaar/mvp/ArthSaathiWorkflowRepository.kt
            app/src/main/java/com/udhaardaar/mvp/ArthSaathiNavigation.kt
            app/src/main/java/com/udhaardaar/mvp/ArthSaathiArchitectureRegistry.kt
            app/src/main/java/com/udhaardaar/mvp/ArthSaathiLoginActivity.kt
            app/src/main/java/com/udhaardaar/mvp/ArthSaathiHomeActivity.kt
            app/src/main/java/com/udhaardaar/mvp/ArthSaathiModulesActivity.kt
            app/src/main/java/com/udhaardaar/mvp/ArthSaathiMasterModuleActivity.kt
          )
          if grep -nE 'V3|V4|V5|V6|V62|V7|V5LocalStore|V5WorkflowRepository|V62Store|V62Repository|V7AccountStore|V7HomeActivity|V62HomeActivity' "${files[@]}"; then
            echo "Legacy dependency detected in canonical ArthSaathi layer."
            exit 1
          fi
          if grep -nE 'V3|V4|V5|V6|V62|V7' app/src/main/AndroidManifest.xml; then
            echo "Legacy activity/version remains in active manifest."
            exit 1
          fi
          echo "PASS: canonical layer has no legacy-version dependency."
      - name: Compile and build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arthsaathi-8.0-independent-master-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
