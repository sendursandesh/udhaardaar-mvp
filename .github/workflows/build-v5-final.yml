name: Build Udhaardaar V5 Thorough Rectification

on:
  workflow_dispatch:
  push:
    branches:
      - v5-thorough-rectification-2026-09-03

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact V5 rectification branch
        uses: actions/checkout@v4
        with:
          ref: v5-thorough-rectification-2026-09-03
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Gradle 8.10.2
        shell: bash
        run: |
          set -e
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.10.2/bin" >> "$GITHUB_PATH"
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Verify V5 release source
        shell: bash
        run: |
          set -e
          SRC=app/src/main/java/com/udhaardaar/mvp
          MAN=app/src/main/AndroidManifest.xml
          for f in LoginActivity.kt V5HomeActivity.kt V5CreditRegistrationActivity.kt V5PartyActivity.kt V5QrCreditActivity.kt V5RepaymentActivity.kt V5TtmmActivity.kt V5PlatformEngine.kt V5LocalStore.kt; do test -s "$SRC/$f"; done
          grep -q 'LoginActivity' "$MAN"
          grep -q 'V5HomeActivity' "$MAN"
          grep -q 'V5CreditRegistrationActivity' "$MAN"
          grep -q 'V5PartyActivity' "$MAN"
          grep -q 'V5RepaymentActivity' "$MAN"
          grep -q 'V5QrCreditActivity' "$MAN"
          grep -q 'V5TtmmActivity' "$MAN"
          grep -q 'V5OtpConsentService' "$SRC/V5CreditRegistrationActivity.kt"
          grep -q 'generateDpnTemplate' "$SRC/V5CreditRegistrationActivity.kt"
          grep -q 'generateGuaranteeTemplate' "$SRC/V5CreditRegistrationActivity.kt"
          grep -q 'BULLET_PRINCIPAL_ONLY' "$SRC/V5RepaymentActivity.kt"
          echo 'V5 source gate PASSED'
      - name: Compile V5 APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: APK integrity and package gate
        shell: bash
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          test "$(stat -c%s "$APK")" -gt 10000
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.udhaardaar.mvp'"
      - name: Upload V5 APK
        uses: actions/upload-artifact@v4
        with:
          name: Udhaardaar-V5-Thorough-Rectification
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
