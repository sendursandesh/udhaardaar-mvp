name: Udhaardaar V5 Infrastructure Build
on:
  push:
    branches: [ v5-infra-rebuild-2026-08-30 ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v5-infra-rebuild-2026-08-30
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo /opt/gradle-8.10.2/bin >> $GITHUB_PATH
      - name: Compile and package
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: APK integrity gate
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk | grep -q "package: name='com.udhaardaar.mvp'"
      - uses: actions/upload-artifact@v4
        with:
          name: Udhaardaar-V5-Infrastructure-Rebuild-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
