name: Final ArthSaathi Build Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo /opt/gradle-8.10.2/bin >> "$GITHUB_PATH"

      - name: Static regression gates
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ARTHSAATHI' app/src/main/java/com/udhaardaar/mvp/LoginActivity.kt
          grep -q 'Your Money. Your Records. Your Rights.' app/src/main/java/com/udhaardaar/mvp/LoginActivity.kt
          grep -q 'fun pan' app/src/main/java/com/udhaardaar/mvp/V5DomainModels.kt
          grep -q 'fun aadhaar' app/src/main/java/com/udhaardaar/mvp/V5DomainModels.kt
          grep -q 'fun gstin' app/src/main/java/com/udhaardaar/mvp/V5DomainModels.kt
          grep -q 'sourceQr' app/src/main/java/com/udhaardaar/mvp/V5WorkflowRepository.kt
          grep -q 'markBorrowerConsent' app/src/main/java/com/udhaardaar/mvp/V5WorkflowRepository.kt
          grep -q 'Asset Vault' app/src/main/java/com/udhaardaar/mvp/ArthSaathiHomeActivity.kt
          grep -q 'Insurance & Benefits' app/src/main/java/com/udhaardaar/mvp/ArthSaathiHomeActivity.kt
          grep -q 'ChargeCheck' app/src/main/java/com/udhaardaar/mvp/ArthSaathiHomeActivity.kt
          grep -q 'Will & Legacy Planner' app/src/main/java/com/udhaardaar/mvp/ArthSaathiHomeActivity.kt
          grep -q 'Inheritance & Claim Centre' app/src/main/java/com/udhaardaar/mvp/ArthSaathiHomeActivity.kt
          grep -q 'Legal Assistance' app/src/main/java/com/udhaardaar/mvp/ArthSaathiHomeActivity.kt
          grep -q 'TTMM' app/src/main/java/com/udhaardaar/mvp/ArthSaathiHomeActivity.kt

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: APK integrity and release gates
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          test "$(stat -c%s "$apk")" -gt 1000000

      - name: Upload ArthSaathi APK
        uses: actions/upload-artifact@v4
        with:
          name: ArthSaathi-V6-QA-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
