name: ArthSaathi V6 Final APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: APK integrity and ArthSaathi V6 feature gate
        run: |
          set -e
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          test "$(stat -c%s "$apk")" -gt 10000000
          unzip -t "$apk" >/dev/null
          grep -q 'ARTHSAATHI' app/src/main/java/com/udhaardaar/mvp/ArthSaathiHomeActivity.kt
          grep -q 'QR KHATA' app/src/main/java/com/udhaardaar/mvp/ArthSaathiHomeActivity.kt
          grep -q 'INSURANCE' app/src/main/java/com/udhaardaar/mvp/ArthSaathiModulesActivity.kt
          grep -q 'WILL' app/src/main/java/com/udhaardaar/mvp/ArthSaathiModulesActivity.kt
          grep -q 'LEGAL' app/src/main/java/com/udhaardaar/mvp/ArthSaathiModulesActivity.kt
          grep -q 'AI FINANCIAL' app/src/main/java/com/udhaardaar/mvp/ArthSaathiModulesActivity.kt
          grep -q 'sourceQr' app/src/main/java/com/udhaardaar/mvp/V5WorkflowRepository.kt
          grep -q 'markBorrowerConsent' app/src/main/java/com/udhaardaar/mvp/V5WorkflowRepository.kt
          grep -q 'Asset Vault' app/src/main/java/com/udhaardaar/mvp/ArthSaathiHomeActivity.kt
          grep -q 'Inheritance' app/src/main/java/com/udhaardaar/mvp/ArthSaathiHomeActivity.kt
          grep -q 'Legal Assistance' app/src/main/java/com/udhaardaar/mvp/ArthSaathiHomeActivity.kt
      - name: Upload ArthSaathi V6 APK
        uses: actions/upload-artifact@v4
        with:
          name: ArthSaathi-V6-Final-QA-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
