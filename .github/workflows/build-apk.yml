name: Build ArthSaathi V7 Master Architecture Release Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - v7-master-architecture-2026-10-05

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V7 master architecture source
        uses: actions/checkout@v4
        with:
          ref: v7-master-architecture-2026-10-05
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Gradle 8.10.2
        shell: bash
        run: |
          set -e
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.10.2/bin" >> "$GITHUB_PATH"
      - name: Run V7 unit regression tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Compile V7
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: V7 master architecture acceptance gates
        shell: bash
        run: |
          set -e
          test -f app/src/main/java/com/udhaardaar/mvp/V5CreditRegistrationActivity.kt
          grep -q "Credit Received" app/src/main/java/com/udhaardaar/mvp/V5CreditRegistrationActivity.kt
          grep -q "Lender / creditor" app/src/main/java/com/udhaardaar/mvp/V5CreditRegistrationActivity.kt
          grep -q "Guarantor name" app/src/main/java/com/udhaardaar/mvp/V5CreditRegistrationActivity.kt
          grep -q "CONSENT: LENDER" app/src/main/java/com/udhaardaar/mvp/V5CreditRegistrationActivity.kt
          grep -q "CONSENT: BORROWER" app/src/main/java/com/udhaardaar/mvp/V5CreditRegistrationActivity.kt
          grep -q "CONSENT: GUARANTOR" app/src/main/java/com/udhaardaar/mvp/V5CreditRegistrationActivity.kt
          grep -q "CREATE / REFRESH DIGITAL DOCUMENT PACKET" app/src/main/java/com/udhaardaar/mvp/V5CreditRegistrationActivity.kt
          grep -q "Create digital DPN before registering" app/src/main/java/com/udhaardaar/mvp/V5CreditRegistrationActivity.kt
          grep -q "Create guarantor guarantee before registering" app/src/main/java/com/udhaardaar/mvp/V5CreditRegistrationActivity.kt
          grep -q 'put("lenderConsent"' app/src/main/java/com/udhaardaar/mvp/V5CreditRegistrationActivity.kt
          grep -q 'put("borrowerConsent"' app/src/main/java/com/udhaardaar/mvp/V5CreditRegistrationActivity.kt
          grep -q 'put("guarantorConsent"' app/src/main/java/com/udhaardaar/mvp/V5CreditRegistrationActivity.kt
          grep -q 'btn("HOME"' app/src/main/java/com/udhaardaar/mvp/V5CreditRegistrationActivity.kt
          grep -q 'V5CreditRegistrationActivity' app/src/main/AndroidManifest.xml
          grep -q 'V5CreditRegistrationActivity' app/src/main/java/com/udhaardaar/mvp/V5HomeActivity.kt
          grep -q 'SEND OTP' app/src/main/java/com/udhaardaar/mvp/LoginActivity.kt
          grep -q 'VERIFY OTP + CREATE PROFILE' app/src/main/java/com/udhaardaar/mvp/LoginActivity.kt
          grep -q 'validMobile' app/src/main/java/com/udhaardaar/mvp/LoginActivity.kt
          test -f app/src/main/java/com/udhaardaar/mvp/ChargeCheckActivity.kt
          test -f app/src/main/java/com/udhaardaar/mvp/GroupKhataActivity.kt
          grep -q 'ChargeCheckActivity' app/src/main/AndroidManifest.xml
          grep -q 'GroupKhataActivity' app/src/main/AndroidManifest.xml
          grep -q 'ChargeCheck' app/src/main/java/com/udhaardaar/mvp/V7HomeActivity.kt
          grep -q 'Group Khata' app/src/main/java/com/udhaardaar/mvp/V7HomeActivity.kt
          grep -q 'ChargeCheckActivity' app/src/main/java/com/udhaardaar/mvp/V7HomeActivity.kt
          grep -q 'GroupKhataActivity' app/src/main/java/com/udhaardaar/mvp/V7HomeActivity.kt
          grep -q 'Register Credit' app/src/main/java/com/udhaardaar/mvp/V7HomeActivity.kt
          grep -q 'Asset Vault' app/src/main/java/com/udhaardaar/mvp/V7HomeActivity.kt
          grep -q 'Legal & Claims' app/src/main/java/com/udhaardaar/mvp/V7HomeActivity.kt
          grep -q 'SEND OTP' app/src/main/java/com/udhaardaar/mvp/LoginActivity.kt
          grep -q 'VERIFY OTP + CREATE PROFILE' app/src/main/java/com/udhaardaar/mvp/LoginActivity.kt
          echo "V7 master architecture critical-flow gates passed."
      - name: APK integrity and package gates
        shell: bash
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          test "$(stat -c%s "$APK")" -gt 10000
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.udhaardaar.mvp'"
      - name: Upload verified V7 APK
        uses: actions/upload-artifact@v4
        with:
          name: ArthSaathi-V7-Master-Architecture
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
