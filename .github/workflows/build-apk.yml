name: Build Udhaardaar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v3-development
      - v3.2.2-final-fixes
      - agent/v3.2-functional

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Repair known Kotlin syntax blockers
        run: |
          # Undo the previous build-time transformation that incorrectly changed valid Elvis operators.
          find app/src/main/java -name '*.kt' -print0 | xargs -0 sed -i -E 's/\?[[:space:]]*:[[:space:]]*/?:/g'
          # Kotlin requires separation around else when it is immediately followed by a string literal.
          find app/src/main/java -name '*.kt' -print0 | xargs -0 sed -i -E 's/else"/else "/g'
          # V3 safe launcher must use the database's hasUser() API.
          sed -i 's/val c = db\.user()/val exists = db.hasUser()/g' app/src/main/java/com/udhaardaar/mvp/V32SafeLauncherActivity.kt
          sed -i '/val exists = c\.moveToFirst()/d;/c\.close()/d' app/src/main/java/com/udhaardaar/mvp/V32SafeLauncherActivity.kt
      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Udhaardaar-V3.2.2-debug-APK-${{ github.ref_name }}
          path: app/build/outputs/apk/debug/app-debug.apk