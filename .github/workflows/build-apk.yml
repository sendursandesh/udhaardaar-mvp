name: Build Udhaardaar APK v3.2

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout V3.2.1 development branch
        uses: actions/checkout@v4
        with:
          ref: v3-development

      - name: Show build revision
        run: |
          echo "Building V3.2.1 from v3-development"
          git rev-parse HEAD

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Udhaardaar V3.2.1 Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Udhaardaar V3.2.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: Udhaardaar-V3.2.1-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
