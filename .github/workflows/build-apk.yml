name: Build Udhaardaar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v3-development
      - v3.2.2-final-fixes
      - agent/v3.2-functional

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Validate V3.2 source
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n 'else"' app/src/main/java --include='*.kt'; then
            echo 'Invalid Kotlin else-string syntax remains.'
            exit 1
          fi
          sed -i 's/textColor(navy)/setTextColor(navy)/g' app/src/main/java/com/udhaardaar/mvp/V32Activity.kt
          if grep -R -n 'db\.user()' app/src/main/java --include='*.kt'; then
            echo 'Obsolete db.user() call remains.'
            exit 1
          fi
      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Udhaardaar-V3.2.2-debug-APK-${{ github.ref_name }}
          path: app/build/outputs/apk/debug/app-debug.apk
