name: Legacy APK Build (V3 corrections source)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact V3 complete-correction branch
        uses: actions/checkout@v5
        with:
          ref: v3-complete-correction-pass-2026-08-27
          fetch-depth: 1
      - name: Verify exact source
        run: |
          echo "Building from v3-complete-correction-pass-2026-08-27"
          git rev-parse HEAD
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: udhaardaar-v3-corrections-debug-manual
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
