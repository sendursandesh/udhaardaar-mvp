name: Build Udhaardaar V3.2.4 Launch Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v3-development
      - v3.2.2-final-fixes
      - agent/v3.2-functional
  pull_request:
    branches:
      - v3-development

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare V3.2.4 launch candidate
        run: python3 scripts/prepare_v324.py
      - name: Static launch/privacy/validation QA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m=Path('app/src/main/AndroidManifest.xml').read_text()
          v=Path('app/src/main/java/com/udhaardaar/mvp/V323Activity.kt').read_text()
          assert 'android:name=".V323Activity" android:exported="true"' in m
          assert 'loginScreen()' in v
          assert 'ownerRegistration()' in v
          assert 'validPan' in v and 'validGstin' in v
          assert 'validMobile' in v and 'validAadhaar' in v
          assert 'consent' in v.lower()
          print('Static QA PASS')
          PY
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Repeat artifact/integrity verification 10 times
        run: |
          for i in $(seq 1 10); do
            echo "Verification $i/10"
            test -s app/build/outputs/apk/debug/app-debug.apk
            sha256sum app/build/outputs/apk/debug/app-debug.apk
          done
      - name: Upload launch candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: Udhaardaar-V3.2.4-launch-candidate-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
