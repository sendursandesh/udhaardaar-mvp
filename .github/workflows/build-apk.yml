name: Build Udhaardaar V6 APK

on:
  workflow_dispatch:
  push:
    branches:
      - v6-development

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Normalize legacy Kotlin syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          roots = [Path('app/src/main/java/com/udhaardaar/mvp/V32Activity.kt'), Path('app/src/main/java/com/udhaardaar/mvp/V32DatabaseHelper.kt'), Path('app/src/main/java/com/udhaardaar/mvp/V32SafeLauncherActivity.kt')]
          for path in roots:
              if not path.exists(): continue
              s = path.read_text(encoding='utf-8')
              s = re.sub(r'\)(\s*)"([^"\n]*)"else"([^"\n]*)"', r') "\2" else "\3"', s)
              s = re.sub(r'\)\s*([A-Za-z_][A-Za-z0-9_]*)\s*:\s*([A-Za-z_][A-Za-z0-9_]*)', r') \1 else \2', s)
              path.write_text(s, encoding='utf-8')
          p = Path('app/src/main/java/com/udhaardaar/mvp/V32Activity.kt')
          if p.exists(): p.write_text(p.read_text(encoding='utf-8').replace('textColor(navy)', 'setTextColor(navy)'), encoding='utf-8')
          PY
      - name: Build V6 Debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload V6.0.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: Udhaardaar-V6.0.1-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
