name: Build Udhaardaar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v3-development
      - agent/v3.2-functional

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Repair V3.2.1 Kotlin source formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/udhaardaar/mvp/V32Activity.kt')
          s = p.read_text()
          # Replace accidental backslash + physical newline with a valid Kotlin newline escape.
          s2 = s.replace(chr(92) + chr(10), chr(92) + 'n')
          if s2 != s:
              p.write_text(s2)
              print('Repaired Kotlin line continuations in V32Activity.kt')
          else:
              print('No source repair needed')
          PY

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Udhaardaar-V3.2.1-debug-APK-${{ github.ref_name }}
          path: app/build/outputs/apk/debug/app-debug.apk

# V3.2.1 profile OTP/mobile fix build
