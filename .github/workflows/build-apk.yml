name: Build Udhaardaar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v3-development
      - v3.2.2-final-fixes
      - agent/v3.2-functional
      - v4-market-ready
  pull_request:
    branches:
      - v3-development
      - v4-market-ready

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Apply mobile-number OTP login gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/udhaardaar/mvp/V323Activity.kt')
          s = p.read_text(encoding='utf-8')
          old = '''        if (db.hasUser() && prefs.getBoolean("logged_in", false)) dashboard() else ownerRegistration()'''
          new = '''        if (db.hasUser() && prefs.getBoolean("logged_in", false)) dashboard() else loginScreen()'''
          if old not in s:
              raise SystemExit('onCreate login gate pattern not found')
          s = s.replace(old, new, 1)
          old_method = '''    private fun ownerRegistration() {'''
          login = '''    private fun loginScreen() {
          history.clear()
          val r = root()
          val hero = LinearLayout(this).apply {
              orientation = LinearLayout.VERTICAL
              gravity = Gravity.CENTER_HORIZONTAL
              setPadding(dp(14), dp(18), dp(14), dp(18))
              background = bg(Color.WHITE, Color.rgb(185, 218, 235), 26)
          }
          hero.addView(logo(94))
          hero.addView(label("Udhaardaar", 30f, navy).apply { gravity = Gravity.CENTER })
          hero.addView(label("Secure login with mobile number + OTP", 14f, teal).apply { gravity = Gravity.CENTER })
          r.addView(hero)
          r.addView(gap(14))
          r.addView(label("Login", 22f, navy))
          r.addView(label("Enter the mobile number registered with Udhaardaar. Name alone can never authenticate an account.", 12f, Color.rgb(70, 90, 105)))
          val mobile = field("Registered mobile number * (10 digits)", 10)
          val otpBox = field("Enter 6-digit OTP", 6).apply { visibility = View.GONE }
          r.addView(mobile, LinearLayout.LayoutParams(-1, dp(56)).apply { setMargins(0, dp(4), 0, dp(4)) })
          r.addView(otpBox)
          r.addView(button("SEND OTP", blue) {
              val number = mobile.text.toString().trim()
              if (!Regex("[0-9]{10}").matches(number)) {
                  toast("Enter exactly 10 digits for the registered mobile number")
                  return@button
              }
              val u = db.userData()
              if (u == null || u.mobile != number) {
                  toast("This mobile number is not registered. Please create an account first.")
                  return@button
              }
              otp = Random.nextInt(100000, 1000000).toString()
              otpBox.visibility = View.VISIBLE
              toast("Demo OTP: $otp")
          })
          r.addView(button("VERIFY OTP + LOGIN", green) {
              val number = mobile.text.toString().trim()
              val u = db.userData()
              if (u == null || u.mobile != number) {
                  toast("Mobile number is not registered")
                  return@button
              }
              if (otp.isBlank() || otpBox.text.toString() != otp) {
                  toast("Incorrect or expired OTP")
                  return@button
              }
              prefs.edit().putBoolean("logged_in", true).apply()
              otp = ""
              dashboard()
          })
          r.addView(gap(6))
          r.addView(button("CREATE NEW ACCOUNT", teal) { ownerRegistration() })
          show(r, false)
      }

''' + old_method
          if old_method not in s:
              raise SystemExit('ownerRegistration insertion point not found')
          s = s.replace(old_method, login, 1)
          old_logout = '''r.addView(button("LOGOUT",Color.rgb(90,110,125)){ prefs.edit().putBoolean("logged_in",false).apply(); history.clear(); ownerRegistration() }); show(r,false)'''
          new_logout = '''r.addView(button("LOGOUT",Color.rgb(90,110,125)){ prefs.edit().putBoolean("logged_in",false).apply(); history.clear(); loginScreen() }); show(r,false)'''
          if old_logout in s:
              s = s.replace(old_logout, new_logout, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Build Udhaardaar Debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Udhaardaar Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Udhaardaar-v4-market-ready-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
