name: Build Udhaardaar V3 Launch Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v3-development
      - v3.2.2-final-fixes
      - agent/v3.2-functional
      - release-v3.3-qa
  pull_request:
    branches:
      - v3-development

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare V3 launch candidate
        run: python3 scripts/prepare_v324.py
      - name: Static V3 launch/privacy/data QA
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('app/src/main/AndroidManifest.xml').read_text()
          login = Path('app/src/main/java/com/udhaardaar/mvp/LoginActivity.kt').read_text()
          v323 = Path('app/src/main/java/com/udhaardaar/mvp/V323Activity.kt').read_text()
          db = Path('app/src/main/java/com/udhaardaar/mvp/V32DatabaseHelper.kt').read_text()
          foundation = Path('app/src/main/java/com/udhaardaar/mvp/V3Foundation.kt').read_text()
          rental = Path('app/src/main/java/com/udhaardaar/mvp/RentalAgreementGenerator.kt').read_text()
          app = Path('app/src/main/java/com/udhaardaar/mvp/UdhaardaarApp.kt').read_text()

          assert '<activity android:name=".LoginActivity" android:exported="true"' in manifest
          assert 'android.intent.action.MAIN' in manifest and 'android.intent.category.LAUNCHER' in manifest
          assert 'class LoginActivity' in login
          assert 'loginScreen()' in login or 'loginScreen()' in v323
          assert 'Random.nextInt(100000, 1000000)' in login or 'Random.nextInt(100000,1000000)' in v323
          assert 'Mobile number is not registered' in login or 'No registered profile found' in v323
          assert 'ownerRegistration()' in v323
          assert 'dashboard()' in v323
          assert 'Register Credit' in v323
          assert 'Guarantor Profile' in v323
          assert 'repayments(' in v323
          assert 'consent' in v323.lower()
          assert '10 digits' in v323
          assert 'CREATE TABLE' in db
          assert 'audit_events' in foundation
          assert 'access_consents' in foundation
          assert 'agreement_documents' in foundation
          assert 'repayment_consents' in foundation
          assert 'credit_score_snapshots' in foundation
          assert 'profile_verifications' in foundation
          assert 'co_borrowers' in foundation
          assert 'rental_lease_terms' in foundation
          assert 'V3Foundation.ensure' in app
          assert 'RentalAgreementGenerator' in rental
          assert 'Landlord' in rental
          assert 'Tenant' in rental
          assert 'monthlyRent' in rental
          assert 'securityDeposit' in rental
          print('Static V3 QA PASS')
          PY
      - name: Deterministic V3 functional business QA
        run: python3 scripts/v3_functional_qa.py
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Repeat artifact/integrity verification 10 times
        run: |
          for i in $(seq 1 10); do
            echo "Verification $i/10"
            test -s app/build/outputs/apk/debug/app-debug.apk
            sha256sum app/build/outputs/apk/debug/app-debug.apk
          done
      - name: Upload launch candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: Udhaardaar-V3-launch-candidate-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
