name: Build Udhaardaar V5 Final QA APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main V5 source
        uses: actions/checkout@v4
        with: {ref: main}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Gradle 8.10.2
        shell: bash
        run: |
          set -e
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.10.2/bin" >> "$GITHUB_PATH"
      - name: Unit regression tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Compile APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Final V5 acceptance gates
        shell: bash
        run: |
          set -e
          test -f app/src/main/java/com/udhaardaar/mvp/V5InformalCreditActivity.kt
          grep -q 'INFORMAL_CREDIT_BORROWER_CONSENT' app/src/main/java/com/udhaardaar/mvp/V5InformalCreditActivity.kt
          grep -q 'End date (auto-calculated' app/src/main/java/com/udhaardaar/mvp/V5InformalCreditActivity.kt
          grep -q 'CREATE / REVIEW DOCUMENT + GET CONSENT' app/src/main/java/com/udhaardaar/mvp/V5InformalCreditActivity.kt
          grep -q 'class V5BorrowerActivity' app/src/main/java/com/udhaardaar/mvp/V5BorrowerActivity.kt
          grep -q 'https://api.postalpincode.in/pincode/' app/src/main/java/com/udhaardaar/mvp/V5BorrowerActivity.kt
          grep -q 'class V5GuarantorConsentActivity' app/src/main/java/com/udhaardaar/mvp/V5GuarantorConsentActivity.kt
          grep -q 'GUARANTOR_GUARANTEE_CONSENT' app/src/main/java/com/udhaardaar/mvp/V5GuarantorConsentActivity.kt
          grep -q 'class V5RentalLeaseActivity' app/src/main/java/com/udhaardaar/mvp/V5RentalLeaseActivity.kt
          grep -q 'formal_credits' app/src/main/java/com/udhaardaar/mvp/V5FormalCreditActivity.kt
          grep -q 'class V5TTMMActivity' app/src/main/java/com/udhaardaar/mvp/V5TTMMActivity.kt
          grep -q 'TTMM_SHARE' app/src/main/java/com/udhaardaar/mvp/V5TTMMActivity.kt
          grep -q 'TTMM_RECOVERY_CONFIRMED' app/src/main/java/com/udhaardaar/mvp/V5TTMMActivity.kt
          grep -q 'class V5AssetVaultActivity' app/src/main/java/com/udhaardaar/mvp/V5AssetVaultActivity.kt
          grep -q 'LIABILITY_CREATED' app/src/main/java/com/udhaardaar/mvp/V5AssetVaultActivity.kt
          grep -q 'class V5SupportWorkflowsActivity' app/src/main/java/com/udhaardaar/mvp/V5SupportWorkflowsActivity.kt
          grep -q 'TRUSTED_ACCESS' app/src/main/java/com/udhaardaar/mvp/V5SupportWorkflowsActivity.kt
          grep -q 'legal_cases' app/src/main/java/com/udhaardaar/mvp/V5SupportWorkflowsActivity.kt
          grep -q 'class V5ChargeComparisonActivity' app/src/main/java/com/udhaardaar/mvp/V5ChargeComparisonActivity.kt
          grep -q 'charge_comparisons' app/src/main/java/com/udhaardaar/mvp/V5ChargeComparisonActivity.kt
          grep -q 'PrintManager' app/src/main/java/com/udhaardaar/mvp/V5ChargeComparisonActivity.kt
          grep -q 'class V5DeathClaimLegalActivity' app/src/main/java/com/udhaardaar/mvp/V5DeathClaimLegalActivity.kt
          grep -q 'death_claim_cases' app/src/main/java/com/udhaardaar/mvp/V5DeathClaimLegalActivity.kt
          grep -q 'class V5OcrService' app/src/main/java/com/udhaardaar/mvp/V5OcrService.kt
          grep -q 'TextRecognition' app/src/main/java/com/udhaardaar/mvp/V5OcrService.kt
          grep -q 'V5FormalCreditActivity' app/src/main/AndroidManifest.xml
          grep -q 'V5SupportWorkflowsActivity' app/src/main/AndroidManifest.xml
          grep -q 'V5ChargeComparisonActivity' app/src/main/AndroidManifest.xml
          grep -q 'V5DeathClaimLegalActivity' app/src/main/AndroidManifest.xml
          grep -q 'V5TTMMActivity' app/src/main/AndroidManifest.xml
          grep -q 'POST_NOTIFICATIONS' app/src/main/AndroidManifest.xml
      - name: QR regression gates
        shell: bash
        run: |
          set -e
          grep -q 'vendor_name' app/src/main/java/com/udhaardaar/mvp/QrCreditScannerActivity.kt
          grep -q 'invoice_no' app/src/main/java/com/udhaardaar/mvp/QrCreditScannerActivity.kt
          grep -q 'invoice_date' app/src/main/java/com/udhaardaar/mvp/QrCreditScannerActivity.kt
          grep -q 'total_amount' app/src/main/java/com/udhaardaar/mvp/QrCreditScannerActivity.kt
          grep -q 'sourceQr' app/src/main/java/com/udhaardaar/mvp/V5WorkflowRepository.kt
      - name: APK integrity
        shell: bash
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          test "$(stat -c%s "$APK")" -gt 10000
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.udhaardaar.mvp'"
      - name: Upload final QA APK
        uses: actions/upload-artifact@v4
        with:
          name: Udhaardaar-V5-Final-QA-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
