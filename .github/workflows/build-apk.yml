name: Build Udhaardaar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v3-development
      - v3.2.2-final-fixes
      - agent/v3.2-functional

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Repair known Kotlin syntax blockers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('app/src/main/java').rglob('*.kt'):
              s = p.read_text(encoding='utf-8')
              s = s.replace('else"', 'else "')
              p.write_text(s, encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('app/src/main/java').rglob('*.kt'):
              s = p.read_text(encoding='utf-8')
              if 'else"' in s:
                  raise SystemExit(f'Invalid else-string literal remains in {p}')
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/udhaardaar/mvp/V32SafeLauncherActivity.kt')
          s = p.read_text(encoding='utf-8')
          s = s.replace('val c = db.user()', 'val exists = db.hasUser()')
          s = s.replace('val exists = c.moveToFirst()\n', '')
          s = s.replace('c.close()\n', '')
          p.write_text(s, encoding='utf-8')
          PY
          grep -R -n 'else"' app/src/main/java || true
      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Udhaardaar-V3.2.2-debug-APK-${{ github.ref_name }}
          path: app/build/outputs/apk/debug/app-debug.apk