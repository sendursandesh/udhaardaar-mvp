name: Build Udhaardaar V4 APK

on:
  workflow_dispatch:
  push:
    branches:
      - v4-market-ready

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout V4 source
        uses: actions/checkout@v4
        with:
          ref: v4-market-ready

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.10.2
        shell: bash
        run: |
          set -e
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.10.2/bin" >> "$GITHUB_PATH"
          /opt/gradle-8.10.2/bin/gradle --version

      - name: Build V4 debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi
          ls -lh "$APK"
          echo "APK=$APK" >> "$GITHUB_OUTPUT"

      - name: Verify APK integrity
        shell: bash
        run: |
          set -e
          APK="${{ steps.apk.outputs.APK }}"
          unzip -t "$APK" >/tmp/apk-unzip-test.txt
          SIZE=$(stat -c%s "$APK")
          if [ "$SIZE" -le 10000 ]; then
            echo "ERROR: APK is unexpectedly small: $SIZE bytes"
            exit 1
          fi
          echo "APK integrity and size verification passed: $SIZE bytes"

      - name: Verify APK package and launcher
        shell: bash
        run: |
          set -e
          APK="${{ steps.apk.outputs.APK }}"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" > /tmp/badging.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/manifest-tree.txt
          grep -q "package: name='com.udhaardaar.mvp'" /tmp/badging.txt
          grep -q "android.intent.action.MAIN" /tmp/manifest-tree.txt
          grep -q "android.intent.category.LAUNCHER" /tmp/manifest-tree.txt
          echo "APK package and launcher verification passed."

      - name: Upload verified V4 APK
        uses: actions/upload-artifact@v4
        with:
          name: Udhaardaar-v4-market-ready-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
