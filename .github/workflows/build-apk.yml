name: Build Udhaardaar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v3-development
      - v3.2.2-final-fixes
      - agent/v3.2-functional

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Normalize Kotlin Elvis syntax
        run: |
          find app/src/main/java -name '*.kt' -print0 | xargs -0 sed -i -E 's/\?\s*:/ ? : /g'
      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Udhaardaar-V3.2.2-debug-APK-${{ github.ref_name }}
          path: app/build/outputs/apk/debug/app-debug.apk