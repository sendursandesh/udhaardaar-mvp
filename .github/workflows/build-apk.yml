name: Build Udhaardaar V4 APK

on:
  workflow_dispatch:
  push:
    branches:
      - v4-market-ready

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V4 source
        uses: actions/checkout@v5
        with:
          ref: v4-market-ready
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build V4 debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: V4 APK QA gate
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          command -v aapt >/dev/null
          aapt dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.udhaardaar.mvp'" /tmp/badging.txt
          grep -q "launchable-activity" /tmp/badging.txt
          test "$(stat -c%s "$APK")" -gt 10000
          echo "V4 APK QA gate PASSED"

      - name: Upload verified V4 APK
        uses: actions/upload-artifact@v4
        with:
          name: Udhaardaar-v4-market-ready-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
