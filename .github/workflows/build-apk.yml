name: Build Udhaardaar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v3-development
      - v3.2.2-final-fixes
      - agent/v3.2-functional
  pull_request:
    branches:
      - v3-development

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Normalize V3.2.2 Kotlin source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = [
              Path('app/src/main/java/com/udhaardaar/mvp/V32Activity.kt'),
              Path('app/src/main/java/com/udhaardaar/mvp/V32DatabaseHelper.kt'),
          ]
          for p in files:
              s = p.read_text(encoding='utf-8')
              s = s.replace('\\"', '"')
              s = re.sub(r'([)\\]}])"', r'\1 "', s)
              s = re.sub(r'\belse"', 'else "', s)
              s = re.sub(r'\breturn"', 'return "', s)
              s = re.sub(r'\bwhen\{', 'when {', s)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Apply V3.2.2 visual theme
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/udhaardaar/mvp/V32Activity.kt')
          s = p.read_text(encoding='utf-8')
          s = s.replace('private val bg = Color.rgb(246, 248, 252)', 'private val bg = Color.rgb(221, 242, 255)')
          s = s.replace('background=box(navy,navy,24)', 'background=box(blue,teal,24)')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Udhaardaar-V3.2.2-debug-APK-${{ github.ref_name }}
          path: app/build/outputs/apk/debug/app-debug.apk
