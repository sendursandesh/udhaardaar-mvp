name: Final V5 Build 2
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: tools platform-tools
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo /opt/gradle-8.10.2/bin >> "$GITHUB_PATH"
      - name: Repair sources
        run: |
          set -e
          sed -i 's/return@button/return@setOnClickListener/g' app/src/main/java/com/udhaardaar/mvp/LoginActivity.kt
          cat > app/src/main/java/com/udhaardaar/mvp/QrCreditScannerActivity.kt <<'EOF'
          package com.udhaardaar.mvp
          import android.content.Intent
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import com.google.zxing.integration.android.IntentIntegrator
          import com.google.zxing.integration.android.IntentResult
          import org.json.JSONObject
          class QrCreditScannerActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) { super.onCreate(savedInstanceState); IntentIntegrator(this).apply { setDesiredBarcodeFormats(IntentIntegrator.QR_CODE); setPrompt("Scan credit / invoice QR code"); setBeepEnabled(true); setOrientationLocked(false) }.initiateScan() }
              override fun onActivityResult(requestCode:Int,resultCode:Int,data:Intent?) { val r:IntentResult?=IntentIntegrator.parseActivityResult(requestCode,resultCode,data); if(r!=null){val raw=r.contents;if(raw.isNullOrBlank()){setResult(RESULT_CANCELED);finish();return};val f=parse(raw);setResult(RESULT_OK,Intent().apply{putExtra("vendor",f.vendor);putExtra("invoice",f.invoice);putExtra("date",f.date);putExtra("amount",f.amount);putExtra("raw",raw)});finish();return};super.onActivityResult(requestCode,resultCode,data)}
              private data class Fields(val vendor:String="",val invoice:String="",val date:String="",val amount:String="")
              private fun parse(raw:String):Fields{return try{val j=JSONObject(raw);Fields(first(j,"vendor","vendor_name","seller","supplier","merchant","party"),first(j,"invoice","invoice_no","invoice_number","bill_no","bill_number"),first(j,"date","invoice_date","transaction_date"),first(j,"amount","total","total_amount","invoice_amount","grand_total"))}catch(_:Exception){val map=raw.split('&','\n',';').mapNotNull{p->val x=p.split('=',':',limit=2);if(x.size==2)x[0].trim().lowercase() to x[1].trim()else null}.toMap();Fields(map["vendor"]?:map["vendor_name"]?:map["seller"]?:map["supplier"]?:"",map["invoice"]?:map["invoice_no"]?:map["invoice_number"]?:"",map["date"]?:map["invoice_date"]?:map["transaction_date"]?:"",map["amount"]?:map["total"]?:map["total_amount"]?:map["invoice_amount"]?:map["grand_total"]?:"")}}
              private fun first(j:JSONObject,vararg keys:String):String=keys.firstNotNullOfOrNull{k->if(j.has(k)&&!j.isNull(k))j.optString(k).takeIf{it.isNotBlank()}else null}?:""
          }
          EOF
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: QA gates
        run: |
          set -e
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          test "$(stat -c%s "$apk")" -gt 10000000
          unzip -t "$apk" >/dev/null
          grep -q 'SCAN QR' app/src/main/java/com/udhaardaar/mvp/V5InformalCreditActivity.kt
          grep -q 'sourceQr' app/src/main/java/com/udhaardaar/mvp/V5WorkflowRepository.kt
          grep -q 'markBorrowerConsent' app/src/main/java/com/udhaardaar/mvp/V5WorkflowRepository.kt
          grep -q 'Rental' app/src/main/java/com/udhaardaar/mvp/V5HomeActivity.kt
          grep -q 'Asset Vault' app/src/main/java/com/udhaardaar/mvp/V5HomeActivity.kt
          grep -q 'Inheritance' app/src/main/java/com/udhaardaar/mvp/V5HomeActivity.kt
          grep -q 'Legal Assistance' app/src/main/java/com/udhaardaar/mvp/V5HomeActivity.kt
      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: Udhaardaar-V5-Final-QA-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
